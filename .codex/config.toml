#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.5"
# model_provider = "openai"
model_provider = "chatgpt-http"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"
personality = "friendly"

notify = ["/Users/cory/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]


[model_providers.chatgpt-http]
name = "ChatGPT HTTP"
base_url = "https://chatgpt.com/backend-api/codex"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false

[features]
multi_agent = true
hooks = true
js_repl = false
# codex_hooks = true

[agents]
max_threads = 10
max_depth = 2

[agents.explorer]
description = "Read-only repository explorer for evidence gathering, code path tracing, and implementation inventory."
config_file = "agents/explorer.toml"

[agents.architect]
description = "Architecture specialist for module boundaries, migration planning, and interface design."
config_file = "agents/architect.toml"

[agents.reviewer]
description = "Read-only correctness and regression reviewer focused on bugs, risk, and missing tests."
config_file = "agents/reviewer.toml"

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"

[mcp_servers.node_repl]
args = []
command = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/Codex.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/cory/.codex"
CODEX_HOME = "/Users/cory/.codex"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "eb55d24cf065cd5311af6f99b16bade2b7a670790ff2db9accf60d012dd55dd1"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.611.62324"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"

[sandbox_workspace_write]
network_access = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

